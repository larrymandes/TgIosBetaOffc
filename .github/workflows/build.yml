name: Build Beta SillyGram IPA

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Create canonical source directory
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios
          mkdir -p /Users/Shared/telegram-ios/build-input
          mkdir -p "$HOME/telegram-bazel-cache"
          sudo mkdir -p /private/var/tmp/_bazel_containerhost

      - name: Select available Xcode
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED_XCODE="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          REQUESTED_APP="/Applications/Xcode_${REQUESTED_XCODE}.app"

          if [[ -d "$REQUESTED_APP" ]]; then
            SELECTED_APP="$REQUESTED_APP"
            echo "Using requested Xcode $REQUESTED_XCODE"
          else
            echo "Xcode $REQUESTED_XCODE is not installed on this runner."
            echo "Selecting the newest installed Xcode instead."
            SELECTED_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -n 1)"
            if [[ -z "$SELECTED_APP" ]]; then
              echo "ERROR: no Xcode installation found"
              exit 1
            fi
            echo "Fallback: $SELECTED_APP"
          fi

          sudo xcode-select -s "$SELECTED_APP/Contents/Developer"
          xcodebuild -version

      - name: Restore Bazel caches
        uses: actions/cache/restore@v4
        with:
          path: |
            /private/var/tmp/_bazel_containerhost
            /Users/Shared/telegram-ios/build-input
            ~/telegram-bazel-cache
          key: beta-sillygram-bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            beta-sillygram-bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}-
            beta-sillygram-bazel-${{ runner.os }}-${{ runner.arch }}-

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          mkdir -p build/artifacts
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="/private/var/tmp/_bazel_containerhost" \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --xcodeManagedCodesigning \
            --disableProvisioningProfiles \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="build/artifacts"

          IPA="build/artifacts/Telegram.ipa"
          if [[ ! -s "$IPA" ]]; then
            echo "ERROR: build completed without producing $IPA"
            find bazel-bin bazel-out -type f -name '*.ipa' -print 2>/dev/null || true
            exit 1
          fi

          echo "IPA produced:"
          ls -lh "$IPA"
          unzip -t "$IPA"

          mkdir -p build/artifacts
          cp "$IPA" "build/artifacts/Beta-SillyGram.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Beta-SillyGram-IPA-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Beta-SillyGram.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Save Bazel caches
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            /private/var/tmp/_bazel_containerhost
            /Users/Shared/telegram-ios/build-input
            ~/telegram-bazel-cache
          key: beta-sillygram-bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
